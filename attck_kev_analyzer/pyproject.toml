[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attck-kev-analyzer"
version = "1.0.0"
description = "Analisis file ATT&CK (Pegasus) dan KEV (Known Exploited Vulnerabilities)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
attck-kev-analyzer = "attck_kev_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["attck_kev_analyzer*"]
